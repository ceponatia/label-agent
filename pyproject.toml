[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "label-agent"
version = "0.1.0"
description = "Watches Gmail for Poshmark/Vinted shipping labels, normalizes them to 4x6, and prints via CUPS"
requires-python = ">=3.12"
dependencies = [
    "pymupdf",
    "opencv-python-headless",
    "numpy",
    "imap-tools",
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "apscheduler",
    "anthropic",
    "replicate",
    "python-dotenv",
    "pyzbar",
    "pillow",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[project.scripts]
label-agent = "labelagent.cli:main"

[tool.setuptools.packages.find]
include = ["labelagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff's defaults plus import sorting. The formatter is deliberately not adopted
# here: `ruff format` disagrees with this codebase's hand-wrapped style in most
# files, so run it only as a deliberate repo-wide reformat.
select = ["E4", "E7", "E9", "F", "I"]
