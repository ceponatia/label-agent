# Label Agent configuration (non-secret settings).
# Copy to config.toml next to the working directory the service runs from.
# Every key is optional; the value shown is the built-in default.
# Any key can also be overridden by the environment variable listed after it,
# which always wins over this file. Secrets belong in .env, not here.

# --- storage ---------------------------------------------------------------
# All state (SQLite DB + label PDFs) lives under this directory.
# env: LABELAGENT_DATA_DIR
data_dir = "data"

# SQLite file. Defaults to <data_dir>/labelagent.db when unset.
# env: LABELAGENT_DB_PATH
# db_path = "data/labelagent.db"

# Delete label PDFs older than this many days (DB rows are kept forever).
# env: LABELAGENT_LABEL_RETENTION_DAYS
label_retention_days = 90

# --- ingestion -------------------------------------------------------------
# Minutes between Gmail polls.
# env: LABELAGENT_POLL_INTERVAL_MIN
poll_interval_min = 3

# env: LABELAGENT_IMAP_HOST
imap_host = "imap.gmail.com"

# env: LABELAGENT_IMAP_FOLDER
imap_folder = "INBOX"

# Sender domains that mark an email as a label candidate.
# env: LABELAGENT_POSHMARK_SENDER_DOMAIN / LABELAGENT_VINTED_SENDER_DOMAIN
poshmark_sender_domain = "poshmark.com"
vinted_sender_domain = "vinted.com"

# --- printing --------------------------------------------------------------
# Printer destination name. Leave empty (or "file") to use the FilePrinter
# fake, which just copies PDFs into <data_dir>/printed/.
# On Windows use the exact name reported by `Get-Printer`.
# On macOS/Linux use the CUPS destination reported by `lpstat -p`.
# env: LABELAGENT_PRINTER
printer_name = ""

# CUPS-only media / tray options; discover real values with
# `lpoptions -p <name> -l`.
# env: LABELAGENT_PRINT_MEDIA / LABELAGENT_PRINT_MEDIA_SOURCE
print_media = "na_index-4x6_4x6in"
print_media_source = "rear"

# Windows uses SumatraPDF for unattended PDF rendering and the normal Windows
# print spooler for queueing/status. Leave this blank to auto-detect a standard
# per-user or system-wide SumatraPDF installation.
# env: LABELAGENT_SUMATRA_PATH
sumatra_path = ""

# Windows-only SumatraPDF -print-settings value. The defaults derive the 4x6
# paper size from the generated PDF, let the driver pick the matching tray,
# preserve portrait orientation, fit inside printable margins, and force simplex.
# env: LABELAGENT_WINDOWS_PRINT_SETTINGS
windows_print_settings = "fit,simplex,paper=auto,bin=auto,disable-auto-rotation,ignore-pdf-print-settings"

# Print ready labels without waiting for a tap in the web UI.
# env: LABELAGENT_AUTO_PRINT
auto_print = true

# --- web app ---------------------------------------------------------------
# LAN-only control panel bind address.
# env: LABELAGENT_WEB_HOST / LABELAGENT_WEB_PORT
web_host = "0.0.0.0"
web_port = 8080

# --- llm -------------------------------------------------------------------
# Model used to classify emails. Text only, and it degrades to the built-in
# regex heuristics when no Anthropic key is set.
# env: LABELAGENT_CLASSIFIER_MODEL
classifier_model = "claude-haiku-4-5"

# Who runs the vision check that verifies the cropped label and reads the
# buyer's name off its ship-to block: "anthropic" (needs ANTHROPIC_API_KEY) or
# "replicate" (needs REPLICATE_API_TOKEN).
#
# Worth knowing before switching: Replicate resells Claude at Anthropic's own
# per-token rate, so it saves nothing, and no model on Replicate accepts a JSON
# schema - the reply is parsed leniently either way. Its per-GPU-second
# community models are cheaper per call only in theory: they cold-boot for
# anything up to minutes, which a label waiting to print cannot afford.
# env: LABELAGENT_VISION_PROVIDER
vision_provider = "anthropic"

# Overrides the provider's default model. Defaults are claude-haiku-4-5 for
# anthropic and google/gemini-3-flash for replicate (about half Claude's price,
# always warm, and strong at reading documents).
# env: LABELAGENT_VISION_MODEL
# vision_model = ""
